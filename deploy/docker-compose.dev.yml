# Ambiente de testes local: só o PostgreSQL. A API, o painel e o launcher rodam
# direto no Windows (cargo / npm), para recompilar rápido.
# Uso: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conexao}
      POSTGRES_USER: ${POSTGRES_USER:-conexao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conexao}
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
