[package]
name = "conexao-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Conexão — launcher de Minecraft para a comunidade de Roleplay"

[dependencies]
conexao-types = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true, features = ["deep-link"] }
tauri-plugin-updater = { workspace = true, optional = true }
theseus = { workspace = true }
discord-rich-presence = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
sha1_smol = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
zip = { workspace = true }


[build-dependencies]
tauri-build = { workspace = true }

[features]
# Atualização automática do launcher (ligada no build de release).
updater = ["dep:tauri-plugin-updater"]

[lints]
workspace = true
