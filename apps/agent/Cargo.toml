[package]
name = "conexao-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Agente do Conexão: roda ao lado do servidor Minecraft e mantém a whitelist sincronizada"

[dependencies]
conexao-types = { workspace = true }
clap = { workspace = true, features = ["derive"] }
eyre = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
