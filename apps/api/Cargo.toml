[package]
name = "conexao-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "API central do Conexão: servidores parceiros, versões de modpack, whitelist e agentes"

[dependencies]
aes-gcm = { workspace = true }
base64 = { workspace = true }
async-minecraft-ping = { workspace = true, features = ["srv"] }
axum = { workspace = true }
bytes = { workspace = true }
conexao-pack = { workspace = true }
conexao-types = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
dotenvy = { workspace = true }
eyre = { workspace = true }
fs4 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[lints]
workspace = true
