[package]
name = "conexao-publish"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Publicador de linha de comando do Conexão: envia uma nova versão do modpack de um servidor"

[dependencies]
conexao-pack = { workspace = true }
conexao-types = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
eyre = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }

[lints]
workspace = true
