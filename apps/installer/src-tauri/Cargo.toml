[package]
name = "conexao-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Instalador do Conexão: baixa a versão mais nova do launcher, confere a assinatura e instala"

[dependencies]
base64 = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
minisign-verify = "0.2.3"
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "time"] }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"

[build-dependencies]
serde_json = { workspace = true }
tauri-build = { workspace = true }

[lints]
workspace = true
